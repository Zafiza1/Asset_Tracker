# Gitleaks configuration (CI job "secrets").
# Default rules stay on; only values that are known, public, test-only are allowlisted.
title = "Asset Tracker"

[extend]
useDefault = true

[allowlist]
description = "Test-only values committed on purpose"
regexes = [
  # DB_CONTEXT_KEY in backend/phpunit.xml: throwaway key for the test database only (never used outside tests).
  '''base64:jR6ehnrMLu61wX9NbAk7fdjrl5a0lFNN4KbGQaovAqM=''',
  # CI-only PostgreSQL passwords in .github/ci/postgres-setup.sql and .github/workflows/ci.yml.
  '''ci_(owner|app|session|queue)''',
]

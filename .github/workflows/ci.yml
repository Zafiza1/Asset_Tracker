# CI for Asset Tracker (Sprint 1, T-04). Free tier: GitHub-hosted runners + open-source tools.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Pint + PHPUnit on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: asset_tracker_v1_test
      DB_USERNAME: ate_app
      DB_PASSWORD: ci_app
      DB_OWNER_USERNAME: ate_owner
      DB_OWNER_PASSWORD: ci_owner
      DB_SESSION_USERNAME: ate_session
      DB_SESSION_PASSWORD: ci_session
      DB_QUEUE_USERNAME: ate_queue
      DB_QUEUE_PASSWORD: ci_queue
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, pgsql, mbstring, zip, gd, intl
          ini-values: memory_limit=1G   # PhpSpreadsheet tests exceed 128M (docs/factory/reviews/T-01-verification.md)
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Create PostgreSQL roles and test database
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f .github/ci/postgres-setup.sql

      - name: Application key
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing --no-interaction

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: PHPUnit
        # vendor/bin/phpunit directly: `php artisan test` does not pass memory_limit to the child process.
        run: vendor/bin/phpunit

  frontend:
    name: Frontend (typecheck, lint, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency & filesystem scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pinned by SHA)
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
